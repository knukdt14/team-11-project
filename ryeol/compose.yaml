services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ryeol-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-exaone3.5:2.4b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: ryeol/Dockerfile.backend
    env_file:
      - path: .env
        required: false
    environment:
      LLM_MODE: ${LLM_MODE:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-20}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-exaone3.5:2.4b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      SEARCH_RERANK: "true"
      HF_HOME: /cache/huggingface
      SESSION_DB_PATH: /runtime/sessions.sqlite3
    volumes:
      - ryeol-hf-cache:/cache/huggingface
      - ryeol-runtime:/runtime
    ports:
      - "8000:8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

  frontend:
    build:
      context: ..
      dockerfile: ryeol/Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ryeol-ollama:
  ryeol-hf-cache:
  ryeol-runtime:
